<ion-split-pane contentId="main-content" when="md">
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <!-- <img src="assets/icon/favicon.png" /> -->
        <!-- <img [src]="regulatorInfo.data ? regulatorInfo.data.logo : 'assets/icon/favicon.png" /> -->
        <img [src]="regulatorInfo.data.logo" />
        @if (regulatorInfo) {
          <ion-title class="ion-text-wrap">{{ regulatorInfo.symbol }}</ion-title>
        }
        @else {
          <ion-title class="ion-text-wrap">Regulator Dashboard</ion-title>
        }
        <ion-buttons slot="end">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list lines="none">
        <ion-item button routerLink="/authorized/dashboard" routerDirection="root" (click)="closeMenuOnMobile()">
          <ion-icon name="home-outline" slot="start"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item button routerLink="/authorized/issuers" routerDirection="root" (click)="closeMenuOnMobile()">
          <ion-icon name="globe-outline" slot="start"></ion-icon>
          <ion-label>Issuers</ion-label>
        </ion-item>
        <ion-item button routerLink="/authorized/assets" routerDirection="root" (click)="closeMenuOnMobile()">
          <ion-icon name="layers-outline" slot="start"></ion-icon>
          <ion-label>Assets</ion-label>
        </ion-item>
        <ion-item button routerLink="/authorized/users" routerDirection="root" (click)="closeMenuOnMobile()">
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label>Users</ion-label>
        </ion-item>
        <ion-item button routerLink="/authorized/logs" routerDirection="root" (click)="closeMenuOnMobile()">
          <ion-icon name="search-outline" slot="start"></ion-icon>
          <ion-label>Logs</ion-label>
        </ion-item>
        <ion-item button routerLink="/authorized/system" routerDirection="root" (click)="closeMenuOnMobile()">
          <ion-icon name="cog-outline" slot="start"></ion-icon>
          <ion-label>System</ion-label>
        </ion-item>
        <ion-item button routerLink="/authorized/profile" routerDirection="root" (click)="closeMenuOnMobile()">
          <ion-icon name="person-circle-outline" slot="start"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>
        <ion-item button (click)="logout()">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
  
  <div id="main-content" class="ion-page">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-split-pane>
