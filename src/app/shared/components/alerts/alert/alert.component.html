@if (alertService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out">
    <div class="bg-white rounded-lg shadow-xl w-full m-4 p-6 transform transition-all duration-300 ease-in-out scale-100" [class]="alertService.maxWidth()">
      <div class="flex items-start">
        <div class="flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
          <svg class="h-6 w-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <!-- 🔴 `min-w-0` IS THE OVERFLOW FIX, NOT `break-words` — which was already on the <p>
             below and could not help. A flex item defaults to `min-width: auto`, so it refuses to
             shrink below its content's intrinsic minimum. A 66-character transaction hash has no
             break opportunity, so this column stayed as wide as the hash and pushed the text OUT
             of the dialog. `overflow-wrap` never got the chance to apply, because the container
             never narrowed enough to need it.
             `flex-1` lets the column take the remaining width now that it is allowed to shrink. -->
        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left min-w-0 flex-1">
          <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
            {{ alertService.title() }}
          </h3>
          <!-- Scroll rather than clip, and rather than growing past the viewport. A reverted
               chain call returns a long string whose TAIL is the informative part, so a fixed
               height that cuts it off would hide the reason while looking like it showed it. -->
          <div class="mt-2 max-h-[60vh] overflow-y-auto">
            <!-- ⚠️ `break-words`, NOT `break-all`. `break-all` breaks MID-WORD, so ordinary prose
       renders as "the venue is now SUSPENDED pending regulat / or review" — measured on the
       Phase 16 bind notice 2026-09-01. `overflow-wrap: break-word` still breaks an
       unbreakable token (an address, a hash, a bare CID) when it would otherwise overflow,
       which is the case `break-all` was reached for, but leaves real words alone. -->
  <p class="text-sm text-gray-600 whitespace-pre-line break-words">
              {{ alertService.message() }}
            </p>
          </div>
        </div>
      </div>
      <div class="mt-5 sm:mt-4 sm:flex sm:flex-row-reverse">
        <button type="button" (click)="onConfirm()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-1.5 bg-[var(--brand-primary)] text-base font-medium text-white hover:bg-[var(--brand-primary-hover)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">
          {{ alertService.confirmText() }}
        </button>
        @if (!alertService.hideCancel()) {
          <button type="button" (click)="onCancel()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-1.5 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:w-auto sm:text-sm">
            {{ 'common.cancel' | translate }}
          </button>
        }
      </div>
    </div>
  </div>
}
