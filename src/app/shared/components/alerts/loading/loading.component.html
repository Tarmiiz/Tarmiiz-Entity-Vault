@if (loadingService.isVisible()) {
  <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center transition-opacity duration-300 ease-in-out">
    <div class="flex flex-col items-center justify-center bg-white rounded-lg shadow-xl p-8">
      <!-- Six blocks of the Tarmiiz mark falling into place. Decorative — the
           status is carried by the message below. Geometry in the SCSS. -->
      <div class="tz-mark" aria-hidden="true">
        <i class="tz-b1"></i><i class="tz-b2"></i><i class="tz-b3"></i>
        <i class="tz-b4"></i><i class="tz-b5"></i><i class="tz-b6"></i>
      </div>
      <p class="mt-4 text-base font-medium text-gray-700">
        {{ loadingService.message() }}
      </p>
      @if (loadingService.progress() !== null) {
        <div class="mt-3 w-64">
          <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
            <div class="h-full bg-indigo-600 transition-all duration-150" [style.width.%]="loadingService.progress()"></div>
          </div>
          <p class="mt-1 text-xs text-gray-500 text-center">{{ loadingService.progress() }}%</p>
        </div>
      }
    </div>
  </div>
}
