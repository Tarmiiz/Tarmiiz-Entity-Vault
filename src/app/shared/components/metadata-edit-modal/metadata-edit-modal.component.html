@if (editService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center" (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg m-4" (click)="$event.stopPropagation()">
      <div class="p-6 border-b bg-[var(--brand-primary)] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">{{ editService.seed()?.title || 'Edit Metadata' }}</h3>
      </div>
      <form [formGroup]="editForm" (ngSubmit)="onSave()">
        <div class="p-6 space-y-4 max-h-[60vh] overflow-y-auto">
          <!-- Description -->
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Description</label>
            <textarea placeholder="Describe this..." formControlName="description" rows="3"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black resize-none"></textarea>
          </div>

          <!-- Additional metadata -->
          <div formArrayName="metadata">
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs font-medium text-gray-500">Additional fields</label>
              <button type="button" (click)="addMetadataRow()"
                class="text-xs text-indigo-600 hover:text-indigo-800">+ Add field</button>
            </div>
            <div class="space-y-2">
              @for (row of metadataRows.controls; let i = $index; track i) {
                <div [formGroupName]="i" class="flex items-center gap-2">
                  <input type="text" placeholder="Key" formControlName="key"
                    class="block w-1/3 border border-gray-300 rounded-md shadow-sm py-1.5 px-2 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-xs text-black">
                  <input type="text" placeholder="Value" formControlName="value"
                    class="block flex-1 border border-gray-300 rounded-md shadow-sm py-1.5 px-2 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-xs text-black">
                  <button type="button" (click)="removeMetadataRow(i)"
                    class="text-gray-400 hover:text-red-600 transition-colors p-1" title="Remove">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/></svg>
                  </button>
                </div>
              }
              @if (metadataRows.controls.length === 0) {
                <p class="text-xs text-gray-400 italic">No additional fields.</p>
              }
            </div>
            @if (metadataError()) {
              <p class="text-xs text-red-600 mt-2">{{ metadataError() }}</p>
            }
          </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
          <button type="button" (click)="onCancel()" class="text-xs px-3 py-1.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="!!metadataError()" class="text-xs px-3 py-1.5 rounded bg-[var(--brand-primary)] text-white hover:bg-[var(--brand-primary-hover)] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
}
