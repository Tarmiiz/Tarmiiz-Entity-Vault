<!-- The page title is NOT rendered here any more — it is reported to
     PageTitleService and drawn in the global top bar, beside the logo (v4 shell).
     All 59 pages keep <app-header [title]="…"> unchanged; that input is now how
     the bar learns the title, so do not remove the tag from a page.

     What remains is the entity-restricted banner, which is page-level content:
     it explains why the tenant is read-only and belongs above the page body, not
     in the chrome. -->
@if (!entityActive) {
  <div class="entity-restricted-banner bg-red-600 text-white text-xs font-semibold py-1.5 px-4">
    <div class="flex items-center justify-center gap-2">
      <span>{{ 'header.entityRestricted' | translate: { state: entityStateName || ('state.unknown' | translate) } }}</span>
      @if (entityStateReason) {
        <button (click)="showReasonAlert()"
          class="underline text-red-100 hover:text-white text-xs font-medium">
          {{ 'common.reason' | translate }}
        </button>
      }
    </div>
  </div>
}
