@if (modalService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4">
      <div class="p-6 border-b bg-[var(--brand-primary)] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">{{ titleKey() | translate }}</h3>
        @if (modalService.dealLabel()) {
          <p class="mt-1 text-xs text-white/80">{{ modalService.dealLabel() }}</p>
        }
      </div>

      <div class="p-6">
        <!-- Say what happens to the money. Every action reachable through this modal is
             terminal and RELEASES escrow — a user who fears their capital is about to be
             stranded will not click, and one who does not realise the deal is over might. -->
        <div class="rounded-md bg-blue-50 border border-blue-200 px-3 py-2 text-xs text-blue-800">
          {{ noteKey() | translate }}
        </div>

        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700">
            {{ 'dex.deals.reasonModal.reasonLabel' | translate }}
            @if (required()) { <span class="text-red-600">*</span> }
          </label>
          <textarea [(ngModel)]="reason" rows="3"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-gray-800"
            [placeholder]="'dex.deals.reasonModal.reasonPlaceholder' | translate"></textarea>
          @if (required()) {
            <p class="mt-1 text-xs text-gray-500">{{ 'dex.deals.reasonModal.reasonRequiredHint' | translate }}</p>
          }
        </div>
      </div>

      <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
        <button type="button" (click)="onCancel()"
          class="text-xs px-3 py-1.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">{{ 'common.cancel' | translate }}</button>
        <button type="button" (click)="onSubmit()" [disabled]="!canSubmit()"
          class="text-xs px-3 py-1.5 rounded bg-red-700 text-white hover:bg-red-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          {{ 'common.confirm' | translate }}
        </button>
      </div>
    </div>
  </div>
}
