@if (addServiceService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out" (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg m-4 transform transition-all duration-300 ease-in-out scale-100" (click)="$event.stopPropagation()">
      <div class="p-6 border-b bg-[#202a3b] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">Add New Service</h3>
      </div>
      <form [formGroup]="addForm" (ngSubmit)="onSave()">
        <div class="p-6 space-y-4">
          <div>
            <input type="text" placeholder="Service Name *" formControlName="name"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
          </div>
          <div>
            <textarea placeholder="Description *" formControlName="description" rows="3"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black resize-none"></textarea>
          </div>
          <div>
            <input type="text" placeholder="Website *" formControlName="website"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
          </div>
          <div>
            <input type="email" placeholder="Email *" formControlName="email"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
          </div>
          <div>
            <input type="tel" placeholder="Mobile *" formControlName="mobile"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
          </div>
          <div>
            <select formControlName="verificationLevel"
              class="block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md text-black">
              <option value="" disabled selected hidden style="color:gray">Verification Level *</option>
              @for (level of verificationLevels(); track level.variableId) {
                <option [value]="level.variableId">{{ level.name }}</option>
              }
            </select>
          </div>
          <div>
            <select formControlName="regulator"
              class="block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md text-black">
              <option value="" disabled selected hidden style="color:gray">Regulator *</option>
              @for (reg of regulators(); track reg.address) {
                <option [value]="reg.address">{{ reg.name }} ({{ reg.symbol }})</option>
              }
            </select>
          </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
          <button type="button" (click)="onCancel()"
            class="text-xs px-3 py-1.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="addForm.invalid"
            class="text-xs px-3 py-1.5 rounded bg-[#202a3b] text-white hover:bg-[#2c3648] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Add Service
          </button>
        </div>
      </form>
    </div>
  </div>
}
