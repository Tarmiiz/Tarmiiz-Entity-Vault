@if (custodianService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out" (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4 transform transition-all duration-300 ease-in-out scale-100" (click)="$event.stopPropagation()">
      <div class="p-6 border-b bg-[var(--brand-primary)] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">
          Change Custodian
        </h3>
      </div>
      <form [formGroup]="custodianForm" (ngSubmit)="onSave()">
        <div class="p-6 space-y-3">
          <p class="text-xs text-gray-500">
            Choose a regulator-endorsed external custodian, or select self-custody to have the service hold its own assets.
          </p>
          <label for="custodian" class="block text-sm font-medium text-gray-700">Custodian</label>
          <select id="custodian" formControlName="custodian" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md text-black">
            <option value="" disabled>Select custodian...</option>
            <option [value]="SELF_CUSTODY">Self-custody</option>
            @for (c of custodians(); track c.address) {
              <option [value]="c.address">{{ c.name || c.address }}</option>
            }
          </select>
        </div>
        <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
          <button type="button" (click)="onCancel()" class="text-xs px-3 py-1.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
            Cancel
          </button>
          <button type="submit" class="text-xs px-3 py-1.5 rounded bg-[var(--brand-primary)] text-white hover:bg-[var(--brand-primary-hover)] transition-colors">
            Update Custodian
          </button>
        </div>
      </form>
    </div>
  </div>
}
