@if (modal.isVisible() && modal.input(); as input) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out" (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4" (click)="$event.stopPropagation()">
      <div class="p-6 border-b bg-[#202a3b] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">
          Add Price &mdash; {{ input.symbol }}
        </h3>
      </div>
      <form [formGroup]="form" (ngSubmit)="onSave()">
        <div class="p-6 space-y-4">
          @if (input.tokenType === 1) {
            <div>
              <label for="bid" class="block text-sm font-medium text-gray-700">Bid</label>
              <input id="bid" type="number" step="any" min="0" formControlName="bid"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-black text-sm focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="0.000000" />
            </div>
            <div>
              <label for="ask" class="block text-sm font-medium text-gray-700">Ask</label>
              <input id="ask" type="number" step="any" min="0" formControlName="ask"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-black text-sm focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="0.000000" />
            </div>
          } @else {
            <div>
              <label for="price" class="block text-sm font-medium text-gray-700">NAV</label>
              <input id="price" type="number" step="any" min="0" formControlName="price"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-black text-sm focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="0.000000" />
              <p class="mt-1 text-xs text-gray-500">Net Asset Value per token.</p>
            </div>
          }
        </div>
        <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-2xl">
          <button type="button" (click)="onCancel()" class="text-xs px-3 py-1.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="!form.valid" class="text-xs px-3 py-1.5 rounded bg-[#202a3b] text-white hover:bg-[#2c3648] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Save Price
          </button>
        </div>
      </form>
    </div>
  </div>
}
