@if (addAssetService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out" (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg m-4 transform transition-all duration-300 ease-in-out scale-100" (click)="$event.stopPropagation()">
      <div class="p-6 border-b bg-[#202a3b] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">Add New Asset</h3>
      </div>
      <form [formGroup]="addForm" (ngSubmit)="onSave()">
        <div class="p-6 space-y-4">
          <div>
            <input type="text" placeholder="Owner Address *" formControlName="owner"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black font-mono">
          </div>
          <div>
            <input type="text" placeholder="Issuer Address *" formControlName="issuer"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black font-mono">
          </div>
          <div>
            <input type="text" placeholder="Manager Address *" formControlName="manager"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black font-mono">
          </div>
          <div>
            <input type="text" placeholder="Asset Name *" formControlName="name"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
          </div>
          <div>
            <input type="text" placeholder="Symbol *" formControlName="symbol"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
          </div>
          <div>
            <textarea placeholder="Description *" formControlName="description" rows="3"
              class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black resize-none"></textarea>
          </div>
          <div>
            <select formControlName="service"
              class="block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md text-black">
              <option value="" disabled selected hidden style="color:gray">Service *</option>
              @for (svc of services(); track svc.address) {
                <option [value]="svc.address">{{ svc.name }}</option>
              }
            </select>
          </div>
          <div>
            <select formControlName="currency" (change)="onCurrencyChange($event)"
              class="block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md text-black">
              <option value="" disabled selected hidden style="color:gray">Currency *</option>
              @for (country of countries(); track country.countryCode) {
                <option [value]="country.countryCode">{{ country.nameShort }} ({{ country.currencyCode }})</option>
              }
            </select>
          </div>
          <div>
            <select formControlName="regulator"
              class="block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md text-black">
              <option value="" disabled selected hidden style="color:gray">Regulator *</option>
              @for (reg of regulators(); track reg.address) {
                <option [value]="reg.address">{{ reg.name }} ({{ reg.symbol }})</option>
              }
            </select>
          </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
          <button type="button" (click)="onCancel()"
            class="px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Cancel
          </button>
          <button type="submit" [disabled]="addForm.invalid"
            class="px-4 py-2 bg-[#202a3b] text-white border border-transparent rounded-md shadow-sm hover:bg-[#2c3648] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
            Add Asset
          </button>
        </div>
      </form>
    </div>
  </div>
}
