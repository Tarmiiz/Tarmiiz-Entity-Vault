@if (addService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out" (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg m-4 transform transition-all duration-300 ease-in-out scale-100" (click)="$event.stopPropagation()">
      <div class="p-6 border-b bg-[#202a3b] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">Add Document</h3>
      </div>
      <div class="p-6 space-y-4 max-h-[60vh] overflow-y-auto">
        <div>
          <label class="block text-sm font-medium text-gray-700">File</label>
          <div class="mt-1 flex items-center gap-2">
            <label for="docFileInput"
              class="text-xs px-3 py-1.5 rounded bg-blue-700 text-white hover:bg-blue-800 transition-colors flex items-center gap-1 cursor-pointer"
              [class.opacity-50]="uploading()"
              [class.cursor-not-allowed]="uploading()">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M12 4v12m0-12l-4 4m4-4l4 4"/>
              </svg>
              Choose File
            </label>
            <span class="text-xs text-gray-600 truncate max-w-[220px]">
              {{ selectedFileName() || 'No file selected' }}
            </span>
            @if (selectedFile()) {
              <button type="button" (click)="clearFile()" [disabled]="uploading()"
                class="text-xs px-2 py-1 rounded bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors flex items-center gap-1 disabled:opacity-50">
                Clear
              </button>
            }
            <input id="docFileInput" type="file" (change)="onFileSelected($event)"
              class="hidden" [disabled]="uploading()">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Title</label>
          <input type="text" [ngModel]="title()" (ngModelChange)="onTitleInput($event)"
            placeholder="Optional — defaults to filename"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">CID</label>
          <input type="text" [ngModel]="cid()" (ngModelChange)="cid.set($event)"
            [disabled]="!!selectedFile()"
            [placeholder]="selectedFile() ? 'Will be generated from uploaded file' : 'Paste IPFS CID or choose a file above'"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black disabled:bg-gray-100 disabled:text-gray-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">File Type (MIME)</label>
          <input type="text" [ngModel]="fileType()" (ngModelChange)="fileType.set($event)"
            [disabled]="!!selectedFile()"
            placeholder="e.g. application/pdf, image/png"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black disabled:bg-gray-100 disabled:text-gray-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Description</label>
          <textarea [ngModel]="description()" (ngModelChange)="description.set($event)" rows="2"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Type</label>
          <select [ngModel]="documentType()" (ngModelChange)="documentType.set(+$event)"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
            @for (v of docTypes(); track v.variableId) {
              <option [ngValue]="v.variableId">{{ v.name }}</option>
            }
          </select>
        </div>
      </div>
      <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
        <button type="button" (click)="onCancel()"
          class="text-xs px-3 py-1.5 rounded bg-gray-700 text-white hover:bg-gray-800 transition-colors flex items-center gap-1">
          Cancel
        </button>
        <button type="button" (click)="onSave()" [disabled]="!isValid() || uploading()"
          class="text-xs px-3 py-1.5 rounded bg-blue-700 text-white hover:bg-blue-800 transition-colors flex items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed">
          Add Document
        </button>
      </div>
    </div>
  </div>
}
