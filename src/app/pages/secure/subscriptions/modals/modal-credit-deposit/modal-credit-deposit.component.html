@if (modalService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center" (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4" (click)="$event.stopPropagation()">
      <div class="p-6 border-b bg-[#202a3b] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">Add Credit</h3>
      </div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Payment Processor</label>
            <select formControlName="paymentProcessor" class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md text-sm text-black bg-white">
              @if (processors().length === 0) {
                <option value="" class="text-black bg-white">No approved processors</option>
              }
              @for (p of processors(); track p.service) {
                <option [value]="p.service" class="text-black bg-white">{{ p.name || p.service }}</option>
              }
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Currency</label>
            <select formControlName="currencyCode" class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md text-sm text-black bg-white">
              @for (c of modalService.currencies(); track c.currencyCode) {
                <option [ngValue]="c.currencyCode" class="text-black bg-white">{{ c.currencyName }} ({{ c.currencySymbol }})</option>
              }
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Amount</label>
            <input type="number" min="0" step="0.01" formControlName="amount"
              class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm text-black" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Note (optional)</label>
            <textarea formControlName="note" rows="2"
              class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm text-black"
              placeholder="Reference / memo..."></textarea>
          </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
          <button type="button" (click)="onCancel()" class="text-xs px-3 py-1.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="!form.valid" class="text-xs px-3 py-1.5 rounded bg-[#202a3b] text-white hover:bg-[#2c3648] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Deposit
          </button>
        </div>
      </form>
    </div>
  </div>
}
