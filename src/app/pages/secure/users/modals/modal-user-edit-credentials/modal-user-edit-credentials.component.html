@if (editUserCredentialsService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out" (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg m-4 transform transition-all duration-300 ease-in-out scale-100" (click)="$event.stopPropagation()">
      <div class="p-6 border-b bg-[var(--brand-primary)] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">
          Edit Credentials: {{ editUserCredentialsService.user()?.name }}
        </h3>
      </div>
      <form [formGroup]="editForm" (ngSubmit)="onSave()">
        <div class="p-6 space-y-4">
          <!-- Mode toggle -->
          <div class="flex rounded-md border border-gray-300 overflow-hidden text-sm font-medium">
            <button type="button" (click)="setMode('password')"
              class="flex-1 px-4 py-2 transition-colors"
              [class.bg-[var(--brand-primary)]]="mode === 'password'" [class.text-white]="mode === 'password'"
              [class.bg-white]="mode !== 'password'" [class.text-gray-600]="mode !== 'password'">
              Change Password
            </button>
            <button type="button" (click)="setMode('full')"
              class="flex-1 px-4 py-2 border-l border-gray-300 transition-colors"
              [class.bg-[var(--brand-primary)]]="mode === 'full'" [class.text-white]="mode === 'full'"
              [class.bg-white]="mode !== 'full'" [class.text-gray-600]="mode !== 'full'">
              Change Username &amp; Password
            </button>
          </div>

          @if (mode === 'full') {
            <div class="rounded-md bg-yellow-50 border border-yellow-200 px-3 py-2 text-xs text-yellow-800">
              Both username and password will be changed. The new username must not already be in use.
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-500">Current Username</label>
              <p class="mt-1 text-sm text-gray-700 font-mono">{{ editUserCredentialsService.user()?.username }}</p>
            </div>
            <div>
              <label for="username" class="block text-sm font-medium text-gray-700">New Username</label>
              <input type="text" autocomplete="off" id="username" formControlName="username" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
            </div>
          }

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">New Password</label>
            <input type="password" autocomplete="new-password" id="password" formControlName="password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
          </div>
          <div>
            <label for="password2" class="block text-sm font-medium text-gray-700">Confirm Password</label>
            <input type="password" autocomplete="new-password" id="password2" formControlName="password2" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-black">
          </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
          <button type="button" (click)="onCancel()" class="text-xs px-3 py-1.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="!editForm.valid" class="text-xs px-3 py-1.5 rounded bg-[var(--brand-primary)] text-white hover:bg-[var(--brand-primary-hover)] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
}
