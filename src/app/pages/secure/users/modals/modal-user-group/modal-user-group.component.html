@if (userGroupService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4 transform transition-all duration-300 ease-in-out scale-100">
      <div class="p-6 border-b bg-[var(--brand-primary)] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">
          {{ 'users.groupModal.title' | translate }}
        </h3>
      </div>
      <form [formGroup]="groupForm" (ngSubmit)="onSave()">
        <div class="p-6">
          <label for="userGroup" class="block text-sm font-medium text-gray-700">{{ 'users.groupModal.label' | translate }}</label>
          <select id="userGroup" formControlName="groupId" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md text-black">
            <option value="">{{ 'common.none' | translate }}</option>
            @for (group of groups(); track group.groupId) {
              <option [value]="group.groupId">{{ group.name }}</option>
            }
          </select>
          <p class="text-xs text-gray-500 mt-2">{{ 'users.groupModal.hint' | translate }}</p>
        </div>
        <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3">
          <button type="button" (click)="onCancel()"
            class="text-xs font-medium px-4 py-1.5 rounded-xl border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="submit"
            class="text-xs font-medium px-4 py-1.5 border border-transparent rounded-xl bg-[var(--brand-primary)] text-white hover:bg-[var(--brand-primary-hover)] transition-colors">
            {{ 'users.groupModal.submit' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
