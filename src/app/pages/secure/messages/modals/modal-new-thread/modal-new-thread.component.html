@if (modalService.isVisible()) {
  <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center transition-opacity duration-300 ease-in-out" (click)="cancel()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg m-4 max-h-[90vh] flex flex-col overflow-hidden transform transition-all duration-300 ease-in-out scale-100" (click)="$event.stopPropagation()">

      <div class="p-6 border-b bg-[#202a3b] rounded-t-xl">
        <h3 class="text-xl leading-6 font-semibold text-gray-100">
          New thread
        </h3>
      </div>

      <div class="p-6 overflow-y-auto flex flex-col gap-4">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Thread type</label>
          <div class="flex gap-2">
            <button type="button"
                    class="flex-1 px-3 py-2 rounded-md border text-sm font-medium transition-colors"
                    [ngClass]="kind()==='entity' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
                    (click)="setKind('entity')">Entity (1:1)</button>
            <button type="button"
                    class="flex-1 px-3 py-2 rounded-md border text-sm font-medium transition-colors"
                    [ngClass]="kind()==='regulator' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
                    (click)="setKind('regulator')">Regulator (1:1)</button>
            <button type="button"
                    class="flex-1 px-3 py-2 rounded-md border text-sm font-medium transition-colors"
                    [ngClass]="kind()==='subscription' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
                    (click)="setKind('subscription')">Subscribers (max 9)</button>
          </div>
        </div>

        <div>
          <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
          <input id="subject" type="text" [ngModel]="subject()" (ngModelChange)="subject.set($event)"
                 class="mt-1 block w-full pl-3 pr-3 py-2 text-sm border border-gray-300 rounded-md text-black focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                 placeholder="Subject (optional)">
        </div>

        <div>
          <label for="search" class="block text-sm font-medium text-gray-700">Search recipients</label>
          <div class="flex gap-2 mt-1">
            <input id="search" type="text" [ngModel]="query()" (ngModelChange)="query.set($event)"
                   (keyup.enter)="search()"
                   class="flex-1 pl-3 pr-3 py-2 text-sm border border-gray-300 rounded-md text-black focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="Name or address…">
            <button type="button" (click)="search()"
                    class="text-xs px-3 py-1.5 rounded bg-gray-700 text-white hover:bg-gray-800 transition-colors">
              Search
            </button>
          </div>
          @if (results().length > 0) {
            <div class="mt-2 border border-gray-200 rounded-md max-h-40 overflow-auto">
              @for (r of results(); track r.address) {
                <div class="px-3 py-2 border-t border-gray-100 first:border-t-0 flex justify-between items-center cursor-pointer hover:bg-gray-50"
                     [class.bg-indigo-50]="isSelected(r)"
                     (click)="toggle(r)">
                  <div class="min-w-0">
                    <div class="text-sm font-medium text-gray-800 truncate">{{ r.name }}</div>
                    <div class="text-[11px] text-gray-500 truncate">{{ r.address }}</div>
                  </div>
                  <input type="checkbox" [checked]="isSelected(r)"
                         (click)="$event.stopPropagation(); toggle(r)"
                         class="h-4 w-4 accent-indigo-600">
                </div>
              }
            </div>
          }
        </div>

        @if (selected().length > 0) {
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Selected ({{ selected().length }})</label>
            <div class="flex flex-wrap gap-1">
              @for (s of selected(); track s.address) {
                <span class="inline-flex items-center bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-xs">
                  {{ s.name }}
                  <button type="button" class="ml-1 text-red-600 hover:text-red-800" (click)="toggle(s)">✕</button>
                </span>
              }
            </div>
          </div>
        }

        <div>
          <label for="initial" class="block text-sm font-medium text-gray-700">Initial message (optional)</label>
          <textarea id="initial" rows="3" [ngModel]="initialText()" (ngModelChange)="initialText.set($event)"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 text-sm text-black focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="Sent immediately after thread creation (to first recipient)…"></textarea>
        </div>

        @if (error()) {
          <div class="p-3 bg-red-50 border border-red-200 rounded-md">
            <p class="text-sm text-red-800">{{ error() }}</p>
          </div>
        }
      </div>

      <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl">
        <button type="button" (click)="cancel()"
                class="text-xs px-3 py-1.5 rounded bg-gray-700 text-white hover:bg-gray-800 transition-colors">
          Cancel
        </button>
        <button type="button" (click)="create()" [disabled]="working() || selected().length === 0"
                class="text-xs px-3 py-1.5 rounded bg-blue-700 text-white hover:bg-blue-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          Create thread
        </button>
      </div>
    </div>
  </div>
}
