<div class="flex items-center justify-center min-h-screen bg-gray-100 font-sans">
  <div class="w-full max-w-5xl flex bg-white rounded-2xl shadow-2xl overflow-hidden my-8">
    
    <!-- Left Decorative Panel -->
    <div class="hidden md:flex w-2/5 bg-[#202a3b] p-10 flex-col justify-center items-start text-white">
      <div class="mb-8">
        <img src="assets/images/logo.svg" alt="">
      </div>
      <h2 class="text-3xl font-bold leading-tight mb-4">Welcome Back!</h2>
      <p class="text-indigo-200 text-lg">Sign in to access the secure regulator dashboard and manage your network.</p>

      <!-- <div class="text-center pt-4" style="margin-top: 50px;">
        <span class="text-sm text-yellow-500">Are you a new cKYC Operator? </span>
        <a routerLink="/public/ckyc" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
          Register Now
        </a>
      </div> -->

      <div class="text-center pt-4" style="margin-top: 50px;">
        <span class="text-sm text-yellow-500">Are you a new Validator? </span>
        <a routerLink="/public/register/validator" class="text-sm font-medium text-cyan-200 hover:text-indigo-500">
          Register Now
        </a>
      </div>

      <div class="text-center pt-1">
        <span class="text-sm text-orange-500">Are you a new Service Provider? </span>
        <a routerLink="/public/register/service" class="text-sm font-medium text-yellow-200 hover:text-indigo-500">
          Register Now
        </a>
      </div>

    </div>

    <!-- Right Form Panel -->
    <div class="w-full md:w-3/5 p-8 sm:p-12 flex flex-col justify-center">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Sign In</h1>
      <p class="text-gray-500 mb-8">Please enter your credentials to continue.</p>

      <form [formGroup]="formLogin" (ngSubmit)="login()" class="space-y-5">
        
        <div class="relative">
          <svg class="w-5 h-5 text-gray-400 absolute top-1/2 left-4 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" /></svg>
          <input type="email" placeholder="Email" formControlName="email" class="w-full border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-12 p-3.5 transition">
        </div>
        
        <div class="relative">
          <svg class="w-5 h-5 text-gray-400 absolute top-1/2 left-4 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
          <input type="password" placeholder="Password" formControlName="password" class="w-full border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-12 p-3.5 transition">
        </div>
        
        <!-- <div class="relative">
          <svg class="w-5 h-5 text-gray-400 absolute top-1/2 left-4 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
          <input type="text" placeholder="Contract" formControlName="contract" class="w-full border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-12 p-3.5 transition">
        </div> -->
        
        <div class="text-right pt-2">
          <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
            Forgot Password?
          </a>
        </div>
        
        <div class="pt-4">
          <button type="submit" class="w-full bg-[#202a3b] hover:bg-[#2c3648] text-white font-bold py-3.5 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            LOGIN
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<app-alert></app-alert>
<app-loading></app-loading>
