
  <div class="flex items-center justify-center min-h-screen bg-gray-100 font-sans">
    <div class="w-full max-w-5xl flex bg-white rounded-2xl shadow-2xl overflow-hidden my-8">

    <!-- Left Decorative Panel -->
      <div class="hidden md:flex w-1/3 bg-[#202a3b] p-8 flex-col justify-center items-center text-white">
        <img src="assets/images/logo.svg" alt="" style="margin-bottom: 70px;">
        <p class="text-indigo-200 text-center text-sm">Join our trusted network of <span class="text-yellow-200">cKYC-ID Services</span> by completing the secure registration process.</p>

        <div class="text-center pt-4" style="margin-top: 50px;">
          <a routerLink="/public/user/login" class="text-sm font-medium text-indigo-200 hover:text-indigo-500">
            Back to Login
          </a>
        </div>
      </div>

      <!-- Right Form Panel -->
      <div class="w-full md:w-2/3 p-6 sm:p-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">cKYC-ID Service Registration</h1>
        <p class="text-gray-500 mb-6">Please fill out the form to get started.</p>

        <form [formGroup]="formRegister" (ngSubmit)="register()" class="space-y-4">
          
          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            <input type="text" placeholder="Name" formControlName="name" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
          </div>
          
          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
            </svg>
            <input type="text" placeholder="Website" formControlName="website" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
          </div>
          
          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18h3" />
            </svg>
            <input type="tel" placeholder="Mobile" formControlName="mobile" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
          </div>

          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <input type="email" placeholder="Email" formControlName="email" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
          </div>

          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
            </svg>
            <input type="text" placeholder="API Address" formControlName="api" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
          </div>

          <!-- <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a28.076 28.076 0 0 1-1.091 9M7.231 4.37a8.994 8.994 0 0 1 12.88 3.73M2.958 15S3 14.577 3 12a8.949 8.949 0 0 1 1.735-5.307m12.84 3.088A5.98 5.98 0 0 1 18 12a30 30 0 0 1-.464 6.232M6 12a6 6 0 0 1 9.352-4.974M4 21a5.964 5.964 0 0 1 1.01-3.328 5.15 5.15 0 0 0 .786-1.926m8.66 2.486a13.96 13.96 0 0 1-.962 2.683M7.5 19.336C9 17.092 9 14.845 9 12a3 3 0 1 1 6 0c0 .749 0 1.521-.031 2.311M12 12c0 3 0 6-2 9"/>
            </svg>
             <select id="validator" placeholder="Select Validator" formControlName="validator" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
              <option value="" disabled selected hidden style="color:gray">Select Validator</option>
              @for(validator of validators(); track validator.address) {
                <option [value]="validator.address">{{ validator.name }}</option>
              }
            </select>
          </div> -->

          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10V7.914a1 1 0 0 1 .293-.707l3.914-3.914A1 1 0 0 1 9.914 3H18a1 1 0 0 1 1 1v6M5 19v1a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1M10 3v4a1 1 0 0 1-1 1H5m14 9.006h-.335a1.647 1.647 0 0 1-1.647-1.647v-1.706a1.647 1.647 0 0 1 1.647-1.647L19 12M5 12v5h1.375A1.626 1.626 0 0 0 8 15.375v-1.75A1.626 1.626 0 0 0 6.375 12H5Zm9 1.5v2a1.5 1.5 0 0 1-1.5 1.5v0a1.5 1.5 0 0 1-1.5-1.5v-2a1.5 1.5 0 0 1 1.5-1.5v0a1.5 1.5 0 0 1 1.5 1.5Z"/>
            </svg>
             <select id="vLevel" placeholder="Select Verification Level" formControlName="vLevel" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
              <option value="" disabled selected hidden style="color:gray">Select Verification Level</option>
              @for(vLevel of vLevels(); track vLevel.variableId) {
                <option [value]="vLevel.variableId">{{ vLevel.name }}</option>
              }
            </select>
          </div>

          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
            </svg>
            <input type="text" autocomplete="username" placeholder="Admin Username" formControlName="admin" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
          </div>

          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
            <input type="password" autocomplete="new-password" placeholder="Password" formControlName="password" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
          </div>
          
          <div class="relative">
            <svg class="w-5 h-5 text-gray-400 absolute top-8 left-3 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
            <input type="password" autocomplete="new-password" placeholder="Confirm Password" formControlName="password2" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5">
          </div>
          
          <div class="pt-2">
            <button type="submit" class="w-full bg-[#202a3b] hover:bg-[#2c3648] text-white font-bold py-3 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
              REGISTER
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <app-alert></app-alert>
  <app-loading></app-loading>
